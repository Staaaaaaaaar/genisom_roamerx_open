laser_mapping:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 2
    max_iteration: 3
    filter_size_surf: 0.2
    filter_size_map: 0.2
    cube_side_length: 1000.0
    common:
        lid_topic:  "/livox/lidar"
        imu_topic:  "/livox/imu"
        time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
        time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
        max_lidar_buffer_size: 50   # reset queued sensor data when SLAM falls this many LiDAR frames behind
        max_imu_buffer_size: 2000   # drop oldest IMU samples above this limit
    preprocess:
        lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
        scan_line: 4
        blind: 0.5
        timestamp_unit: 3
        scan_rate: 10
    mapping:
        acc_cov: 0.1
        gyr_cov: 0.1
        b_acc_cov: 0.0001
        b_gyr_cov: 0.0001
        fov_degree:    360.0
        det_range:     100.0
        extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
        extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
        extrinsic_R: [ 1., 0., 0.,
                    0., 1., 0.,
                    0., 0., 1.]
    publish:
        odom_en: true                # true: publish nav_msgs/Odometry
        tf_en: true                 # true: publish the configured dynamic TF
        path_en: false               # true: publish Path
        path_max_poses: 10000        # 0: unlimited; positive: bound Path memory and message size
        map_en: false                # true: publish the accumulated voxel map
        world_points_en: false       # true: publish current scan in map frame
        body_points_en: false        # true: publish current scan in IMU-body frame
    topics:
        odom: "/slam_odom"
    odom:
        frame_id: "odom"
        child_frame_id: "base_link"
    tf:
        frame_id: "odom"
        child_frame_id: "base_link"
    # Physical transform from the base_link origin to the IMU origin.
    # Translation is expressed in base_link; rotation is row-major and rotates
    # imu_link vectors into base_link. Published pose and Twist are corrected
    # to the base_link origin.
    base_link_to_imu:
        translation: [0.241, 0.02329, 0.16588]
        rotation: [1., 0., 0.,
                   0., 1., 0.,
                   0., 0., 1.]
    save:
        map_en: false                # true: accumulate a bounded voxel map for the save service
        map_voxel_size: 0.2          # meters; one retained point per voxel
        map_max_points: 2000000      # 0: unlimited; positive: hard memory safety limit
    pcd2pgm:
      file_name : "map"
      thre_z_min : -0.1
      thre_z_max : 2.0
      flag_pass_through : 0
      map_resolution : 0.05
      thre_radius : 0.1
      thres_point_count : 10
